<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-label="The groom in a navy double-breasted suit and the bride in an ice-blue lehenga with a long veil">
  <defs>
    <linearGradient id="cpNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3a5c"/><stop offset=".55" stop-color="#1f2a45"/><stop offset="1" stop-color="#151d33"/>
    </linearGradient>
    <linearGradient id="cpNavyLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18213a"/><stop offset=".45" stop-color="#25324f"/><stop offset="1" stop-color="#141b30"/>
    </linearGradient>
    <linearGradient id="cpLapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34446a"/><stop offset="1" stop-color="#25314f"/>
    </linearGradient>
    <radialGradient id="cpGold" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#fff2c8"/><stop offset=".45" stop-color="#d6b36d"/><stop offset="1" stop-color="#8e6a33"/>
    </radialGradient>
    <linearGradient id="cpSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efcfb4"/><stop offset="1" stop-color="#d9ab88"/>
    </linearGradient>
    <linearGradient id="cpShoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5a32"/><stop offset="1" stop-color="#5e3119"/>
    </linearGradient>
    <linearGradient id="cpSkirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aac4c6"/><stop offset=".3" stop-color="#d4e5e5"/><stop offset=".55" stop-color="#c3d9da"/>
      <stop offset=".8" stop-color="#d9e8e8"/><stop offset="1" stop-color="#a3bec1"/>
    </linearGradient>
    <linearGradient id="cpBodice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b6cdcf"/><stop offset=".5" stop-color="#d6e6e6"/><stop offset="1" stop-color="#b1c9cb"/>
    </linearGradient>
    <linearGradient id="cpVeil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeced" stop-opacity=".75"/><stop offset="1" stop-color="#c5dadb" stop-opacity=".55"/>
    </linearGradient>
    <!-- silver embroidery: tiny florets and sequins -->
    <pattern id="cpEmb" width="22" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r=".8" fill="#f7fbfb" opacity=".75"/>
      <g transform="translate(15 18)" opacity=".8"><circle r="2.2" fill="none" stroke="#f6fafa" stroke-width=".6"/><circle r=".7" fill="#fff"/>
      <circle cx="0" cy="-3.6" r=".7" fill="#f6fafa"/><circle cx="3.4" cy="1.2" r=".7" fill="#f6fafa"/><circle cx="-3.4" cy="1.2" r=".7" fill="#f6fafa"/></g>
    </pattern>
    <pattern id="cpEmbDense" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".9" fill="#ffffff" opacity=".95"/>
      <circle cx="6" cy="6" r=".7" fill="#eef5f5"/>
    </pattern>
    <pattern id="cpPaisley" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#a8434f"/><circle cx="5" cy="5" r=".5" fill="#c47a5c"/>
    </pattern>
    <filter id="cpSoft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="230" cy="586" rx="180" ry="14" fill="#3b4f66" opacity=".22" filter="url(#cpSoft)"/>

  <!-- ═══ Bride's veil (behind everything), trailing to the right ═══ -->
  <g class="cp-veil">
    <path d="M262 52 C300 56 318 120 330 210 C342 300 360 400 384 470 C398 512 412 560 418 604 C360 612 300 606 262 596 C276 470 286 330 280 210 C276 140 268 90 262 52Z" fill="url(#cpVeil)"/>
    <path d="M262 52 C300 56 318 120 330 210 C342 300 360 400 384 470 C398 512 412 560 418 604" fill="none" stroke="#f4f9f9" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round" opacity=".95"/>
    <path d="M266 60 C300 70 314 130 324 210 C336 300 352 400 376 474 C390 516 404 560 410 600" fill="none" stroke="#ffffff" stroke-width="1" opacity=".5"/>
    <path d="M262 52 C300 56 318 120 330 210 C342 300 360 400 384 470 C398 512 412 560 418 604 C360 612 300 606 262 596 C276 470 286 330 280 210 C276 140 268 90 262 52Z" fill="url(#cpEmb)" opacity=".7"/>
  </g>

  <!-- ═══ GROOM ═══ -->
  <g class="cp-groom">
    <!-- trousers -->
    <path d="M106 296 L178 296 L172 556 L148 556 L143 336 L139 336 L134 556 L110 556 Z" fill="url(#cpNavyLeg)"/>
    <path d="M122 310 L122 552 M160 310 L160 552" stroke="#2f3d60" stroke-width="1" opacity=".7"/>
    <!-- turn-ups -->
    <path d="M110 548 L134 548 L134 556 L110 556Z M148 548 L172 548 L172 556 L148 556Z" fill="#1a2440"/>
    <!-- brogues -->
    <path d="M108 556 L136 556 L138 568 C128 576 104 577 98 571 C97 564 102 559 108 556Z" fill="url(#cpShoe)"/>
    <path d="M146 556 L174 556 C181 559 186 564 185 571 C178 577 155 576 145 568Z" fill="url(#cpShoe)"/>
    <path d="M104 566 C112 568 126 568 134 565 M150 565 C158 568 172 568 180 566" stroke="#c98a58" stroke-width="1" fill="none" opacity=".7"/>

    <!-- left arm (hanging) -->
    <path d="M100 124 C90 132 86 156 86 180 L84 290 C86 297 100 299 104 292 L108 176 Z" fill="url(#cpNavy)"/>
    <path d="M85 286 L104 288 L104 295 L85 293Z" fill="#cfe0f2"/>
    <ellipse cx="94" cy="306" rx="8" ry="12" fill="url(#cpSkin)"/>

    <!-- jacket body -->
    <path d="M100 124 C112 116 122 113 130 112 L140 148 L150 112 C158 113 168 116 180 124 C187 131 188 142 186 154 L180 302 C160 309 122 309 102 302 L96 154 C94 142 94 131 100 124Z" fill="url(#cpNavy)"/>
    <!-- shirt + tie -->
    <path d="M129 112 L151 112 L140 150Z" fill="#cfe0f2"/>
    <path d="M136 116 L144 116 L143 125 L137 125Z" fill="#6e1f2a"/>
    <path d="M137 125 L143 125 L146 168 L140 176 L134 168Z" fill="#6e1f2a"/>
    <path d="M137 125 L143 125 L146 168 L140 176 L134 168Z" fill="url(#cpPaisley)" opacity=".8"/>
    <!-- peak lapels -->
    <path d="M130 112 L140 148 L138 196 L117 150 L123 140 L113 128 C118 120 124 115 130 112Z" fill="url(#cpLapel)"/>
    <path d="M150 112 L140 148 L142 196 L163 150 L157 140 L167 128 C162 120 156 115 150 112Z" fill="url(#cpLapel)"/>
    <path d="M117 150 L123 140 M163 150 L157 140" stroke="#151d33" stroke-width="1.2"/>
    <!-- double-breasted overlap -->
    <path d="M140 196 L150 302" stroke="#121a2e" stroke-width="1.4" fill="none"/>
    <!-- gold buttons, three rows of two -->
    <g fill="url(#cpGold)">
      <circle cx="124" cy="208" r="3.6"/><circle cx="160" cy="208" r="3.6"/>
      <circle cx="128" cy="240" r="3.6"/><circle cx="158" cy="240" r="3.6"/>
      <circle cx="130" cy="272" r="3.6"/><circle cx="157" cy="272" r="3.6"/>
    </g>
    <!-- pocket flaps -->
    <path d="M103 262 L124 262 L124 268 L103 268Z M160 262 L181 262 L180 268 L160 268Z" fill="#1a2440"/>
    <!-- maroon pocket square + gold chain + flag pin -->
    <path d="M160 156 L176 154 L178 160 L161 162Z" fill="#14203a"/>
    <path d="M163 156 L167 148 L171 155 L175 149 L176 155Z" fill="#7a2532"/>
    <path d="M156 150 C160 164 168 170 178 162 M156 150 C158 172 170 180 180 168" fill="none" stroke="#d9b56d" stroke-width="1.1"/>
    <circle cx="156" cy="150" r="1.6" fill="url(#cpGold)"/>
    <rect x="158" y="131" width="8" height="5.5" rx=".6" fill="#0d5b2c"/><rect x="158" y="131" width="2.2" height="5.5" fill="#fff"/>

    <!-- right arm, bent toward the bride -->
    <path d="M180 124 C190 132 194 150 194 170 L198 214 C198 222 192 226 186 224 L184 178 Z" fill="url(#cpNavy)"/>
    <path d="M198 212 C196 228 186 238 168 246 L162 236 C176 230 184 222 186 214Z" fill="url(#cpNavy)"/>
    <path d="M168 246 L162 236 L158 238 L163 248Z" fill="#cfe0f2"/>
    <ellipse cx="154" cy="246" rx="9" ry="7" fill="url(#cpSkin)" transform="rotate(-20 154 246)"/>

    <!-- head -->
    <rect x="132" y="96" width="16" height="20" rx="5" fill="#d7a985"/>
    <ellipse cx="119" cy="80" rx="3.5" ry="6" fill="#dcae8c"/><ellipse cx="161" cy="80" rx="3.5" ry="6" fill="#dcae8c"/>
    <ellipse cx="140" cy="78" rx="21" ry="26" fill="url(#cpSkin)"/>
    <path d="M120 80 C121 97 130 106 140 106 C150 106 159 97 160 80 C156 90 150 94 140 94 C130 94 124 90 120 80Z" fill="#2c221f"/>
    <path d="M131 92 C136 89 144 89 149 92 C145 94 135 94 131 92Z" fill="#2c221f"/>
    <path d="M118 76 C114 50 130 40 142 41 C158 42 167 54 162 76 C160 64 151 57 140 57 C129 57 121 64 118 76Z" fill="#241c1a"/>
    <path d="M124 52 C134 44 150 44 158 54" stroke="#3d302b" stroke-width="2" fill="none" opacity=".6"/>
  </g>

  <!-- ═══ BRIDE ═══ -->
  <g class="cp-bride">
    <!-- lehenga -->
    <path d="M244 210 L284 210 C306 290 340 420 376 560 C384 572 376 584 360 588 C310 600 214 600 168 590 C152 586 146 574 154 560 C186 420 222 290 244 210Z" fill="url(#cpSkirt)"/>
    <path d="M244 210 L284 210 C306 290 340 420 376 560 C384 572 376 584 360 588 C310 600 214 600 168 590 C152 586 146 574 154 560 C186 420 222 290 244 210Z" fill="url(#cpEmb)"/>
    <!-- folds -->
    <g fill="none" stroke="#9fb9bc" stroke-width="1.4" opacity=".75">
      <path d="M252 216 C236 320 210 450 188 588"/><path d="M262 216 C256 330 246 460 238 594"/>
      <path d="M272 216 C280 330 294 460 304 594"/><path d="M280 216 C300 320 326 450 350 586"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1" opacity=".55">
      <path d="M257 216 C248 330 230 460 214 592"/><path d="M276 216 C288 330 308 460 326 592"/>
    </g>
    <!-- heavy embroidered hem: mirror-work band, scallops, pearl edge -->
    <path d="M170 536 C220 552 312 552 366 536 L376 560 C384 572 376 584 360 588 C310 600 214 600 168 590 C152 586 146 574 154 560Z" fill="#e4eff0" opacity=".55"/>
    <path d="M170 536 C220 552 312 552 366 536 L376 560 C384 572 376 584 360 588 C310 600 214 600 168 590 C152 586 146 574 154 560Z" fill="url(#cpEmbDense)" opacity=".9"/>
    <path d="M166 548 C220 566 314 566 370 548" fill="none" stroke="#ffffff" stroke-width="4.4" stroke-dasharray="0.1 11" stroke-linecap="round" opacity=".95"/>
    <path d="M168 541 C220 557 314 557 368 541" fill="none" stroke="#f3f8f8" stroke-width="1" opacity=".9"/>
    <path d="M160 570 C214 590 318 590 374 568" fill="none" stroke="#f3f8f8" stroke-width="1" stroke-dasharray="3 2" opacity=".9"/>
    <path d="M160 588 C214 604 318 602 362 590" fill="none" stroke="#fbfdfd" stroke-width="4" stroke-dasharray="0.1 6" stroke-linecap="round"/>
    <path d="M176 500 C224 514 310 514 360 500" fill="none" stroke="#f3f8f8" stroke-width="1.2" stroke-dasharray="1 4" opacity=".8"/>
    <!-- bodice (long fitted kameez top) -->
    <path d="M240 124 C248 117 255 114 263 114 C271 114 279 117 287 124 L284 214 C272 220 256 220 244 214 Z" fill="url(#cpBodice)"/>
    <path d="M240 124 C248 117 255 114 263 114 C271 114 279 117 287 124 L284 214 C272 220 256 220 244 214 Z" fill="url(#cpEmbDense)" opacity=".7"/>
    <path d="M244 206 C256 212 272 212 284 206 L284 214 C272 220 256 220 244 214Z" fill="#eaf3f3"/>
    <!-- neckline + necklace -->
    <path d="M254 116 C256 128 270 128 272 116Z" fill="#e3bc9d"/>
    <path d="M252 118 C254 136 272 136 274 118" fill="none" stroke="#f5f7f8" stroke-width="2.2" stroke-dasharray="0.1 3.2" stroke-linecap="round"/>
    <circle cx="263" cy="134" r="2.4" fill="#f6f8fa" stroke="#b7c2c8" stroke-width=".6"/>

    <!-- right sleeve (hanging, holding the veil) -->
    <path d="M287 124 C295 132 298 156 298 178 L298 258 C296 264 286 264 284 258 L282 176 Z" fill="url(#cpBodice)"/>
    <path d="M285 250 L298 250 L298 258 L285 258Z" fill="#eef5f5"/>
    <ellipse cx="291" cy="270" rx="7" ry="10" fill="url(#cpSkin)"/>
    <!-- left sleeve, arm through the groom's -->
    <path d="M240 124 C232 132 228 150 228 172 L226 206 C224 214 230 220 236 218 L244 174 Z" fill="url(#cpBodice)"/>
    <path d="M228 204 C220 222 206 232 190 236 L188 226 C200 222 214 214 222 202Z" fill="url(#cpBodice)"/>
    <path d="M190 236 L188 226 L184 227 L186 237Z" fill="#eef5f5"/>
    <ellipse cx="180" cy="232" rx="8" ry="6" fill="url(#cpSkin)" transform="rotate(-10 180 232)"/>

    <!-- head under the dupatta -->
    <rect x="256" y="102" width="14" height="16" rx="5" fill="#dcb08f"/>
    <ellipse cx="263" cy="86" rx="18" ry="23" fill="url(#cpSkin)"/>
    <path d="M245 84 C244 64 254 58 263 58 C273 58 282 64 281 84 C278 72 271 67 263 67 C255 67 248 72 245 84Z" fill="#2a1f1c"/>
    <!-- maang tikka -->
    <path d="M263 58 L263 68" stroke="#e9eef1" stroke-width="1"/><circle cx="263" cy="70" r="2.6" fill="#f4f7f9" stroke="#aab6bd" stroke-width=".6"/>
    <!-- dupatta framing the face, falling over both shoulders -->
    <path d="M240 92 C236 60 250 44 264 44 C280 44 292 60 288 92 C292 112 298 128 304 150 C292 140 286 124 283 104 C284 76 276 56 263 56 C250 56 243 76 244 104 C241 126 236 140 224 152 C230 130 236 112 240 92Z" fill="#d3e4e4" opacity=".92"/>
    <path d="M240 92 C236 60 250 44 264 44 C280 44 292 60 288 92 C292 112 298 128 304 150 M240 92 C236 112 230 130 224 152" fill="none" stroke="#f6fafa" stroke-width="2.4" stroke-dasharray="0.1 4.5" stroke-linecap="round"/>
  </g>
</svg>
