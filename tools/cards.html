<!doctype html>
<!-- The link-preview image, rendered by
     tools/render_cards.js. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Imperial;src:url(../site/assets/fonts/imperial-script-400-latin.woff2)}
@font-face{font-family:Quicksand;src:url(../site/assets/fonts/quicksand-var-latin.woff2);font-weight:300 700}
@font-face{font-family:Libre;src:url(../site/assets/fonts/libre-baskerville-var-latin.woff2);font-weight:400 700}
html,body{margin:0}
.c{position:relative;width:800px;height:1000px;overflow:hidden;display:none;background:center/cover}
.c.on{display:block}
.og{width:1200px;height:630px}
img{position:absolute}
.t{position:absolute;left:0;right:0;text-align:center}
.s{font-family:Imperial;color:#4a3026}
.k{font-family:Quicksand;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#6e1f2a}
.d{font-family:Libre;color:#6e1f2a;letter-spacing:.2em}
</style></head><body>
<div class="c og" id="og" style="background-image:url(../site/assets/images/paper-ice.jpg)">
  <img src="../site/assets/images/roses-cluster.webp" style="width:420px;left:-120px;top:-130px;rotate:160deg">
  <img src="../site/assets/images/roses-cluster.webp" style="width:440px;right:-130px;bottom:-150px;rotate:-12deg">
  <img id="env" src="" style="width:640px;left:280px;top:110px">
</div>
<script>
const id = new URLSearchParams(location.search).get('card') || 'og';
document.getElementById(id).classList.add('on');
const q = new URLSearchParams(location.search);
if (q.get('env')) document.getElementById('env').src = q.get('env');
</script>
</body></html>
